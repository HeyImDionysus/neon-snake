name: Verify

on:
  push:
  # Pushes already cover branches in this repository; pull requests only add
  # coverage for forks (the job below skips same-repository PR runs).
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-browser-rules:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7.0.15
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Chromium system libraries
        run: npx playwright install-deps chromium

      # Syntax of every JavaScript file, the asset stamp, and the committed
      # Discord SDK bundle. Files are discovered, never listed by hand.
      - name: Static checks
        run: npm run check

      # Every *.test.js file, found by the runner rather than listed here.
      - name: Tests
        run: npm test
        env:
          TEST_JUNIT_PATH: test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Windows wallpaper
        run: npm run build:wallpapers

      - name: Upload Windows wallpaper
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Snake-Lively
          path: dist/wallpapers/Neon-Snake-Lively.zip
          if-no-files-found: error
          retention-days: 30

  android-wallpaper:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      # Every push proves the Android project compiles; release.yml builds the
      # published APK when a version tag is pushed.
      - name: Build Android wallpaper
        run: gradle -p wallpaper/android :app:assembleDebug --stacktrace

      - name: Upload verification Android build
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Snake-Android-debug
          path: wallpaper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
