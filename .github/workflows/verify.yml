name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-browser-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7.0.15
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server runtime
        run: npm ci --ignore-scripts

      - name: Install browser for Activity protocol verification
        run: npx playwright install --with-deps chromium

      - name: Verify syntax
        run: |
          npm run build:activity
          git diff --exit-code -- public/activity-sdk.js
          npm run check:stamp
          node --check public/activity-redirect.js
          node --check public/activity-sdk.js
          node --check public/game.js
          node --check public/game-logic.js
          node --check public/room-transport.js
          node --check public/signal-field.js
          node --check public/duel.js
          node --check public/account.js
          node --check public/profile-config.js
          node --check public/profile.js
          node --check public/touch-controls.js
          node --check public/wallpaper-engine.js
          node --check public/wallpaper.js
          node --check public/downloads.js
          node --check public/sw.js
          node --check server/room-core.cjs
          node --check server/account-core.cjs
          node --check server/realtime-core.cjs
          for file in api/*.mjs api/activity/*.mjs api/auth/discord/*.mjs; do node --check "$file"; done

      - name: Verify deterministic behavior
        run: |
          node asset-stamp.test.js
          node game-logic.test.js
          node ai-quality.test.js
          node canvas-performance.test.js
          CANVAS_BROWSER_REQUIRED=1 node canvas-browser-performance.test.js
          node control-flow.test.js
          node duel-control-flow.test.js
          node duel-quality.test.js
          node duel-authority-consistency.test.js
          node room-transport.test.js
          node room-api.test.js
          node redis-client.test.js
          node identity-system.test.js
          node accessibility.test.js
          node service-worker.test.js
          node deployment-contract.test.js
          node realtime-worker.test.js
          node platform-security.test.js
          node account-persistence.test.js
          node activity-system.test.js
          node activity-lifecycle.test.js
          ACTIVITY_BROWSER_REQUIRED=1 node activity-navigation-browser.test.js
          ACTIVITY_BROWSER_REQUIRED=1 node activity-layout-browser.test.js
          node terminal-room-ui.test.js
          REALTIME_REDIS_REQUIRED=1 node realtime-integration.test.js
          node profile-system.test.js
          node profile-interaction.test.js
          PROFILE_BROWSER_REQUIRED=1 node profile-browser.test.js
          PRODUCT_BROWSER_REQUIRED=1 node product-browser.test.js
          node product-experience.test.js
          node touch-controls.test.js
          node wallpaper-system.test.js

      - name: Build Windows wallpaper
        run: node scripts/build-wallpapers.mjs

      - name: Upload Windows wallpaper
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Snake-Lively
          path: dist/wallpapers/Neon-Snake-Lively.zip
          if-no-files-found: error
          retention-days: 30

  android-wallpaper:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # A release keystore keeps one signing certificate across versions, which
      # is what lets players update in place. Without the secrets the job still
      # builds a debug APK so the project keeps compiling on every push, but
      # that build is for verification only and is not a publishable release.
      # The secrets context is not available in a step condition, so the keystore
      # step always runs and reports whether it found one.
      - name: Restore release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "No release keystore configured; building for verification only."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Android wallpaper
        if: ${{ steps.keystore.outputs.path != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p wallpaper/android :app:assembleRelease --stacktrace

      - name: Build verification-only Android wallpaper
        if: ${{ steps.keystore.outputs.path == '' }}
        run: gradle -p wallpaper/android :app:assembleDebug --stacktrace

      - name: Upload signed Android wallpaper
        if: ${{ steps.keystore.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Snake-Android
          path: wallpaper/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification Android build
        if: ${{ steps.keystore.outputs.path == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Snake-Android-unsigned
          path: wallpaper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
