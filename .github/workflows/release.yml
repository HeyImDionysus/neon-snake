name: Release

# Pushing a tag such as v1.1.3 builds both wallpapers from that commit and
# publishes them as a GitHub Release with checksums. The tag must match the
# version in package.json, which is the project's only version number.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build Windows wallpaper
        run: |
          node scripts/build-wallpapers.mjs
          mkdir -p release
          cp dist/wallpapers/Neon-Snake-Lively.zip "release/Neon-Snake-Lively-v$VERSION.zip"

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      # Signed with this runner's throwaway debug key (see build.gradle.kts):
      # no secrets, but players uninstall the previous version to update.
      - name: Build Android wallpaper
        run: |
          gradle -p wallpaper/android :app:assembleRelease --stacktrace
          apk=wallpaper/android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "release/Neon-Snake-Android-v$VERSION.apk"

      - name: Write checksums
        working-directory: release
        run: sha256sum * | tee SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Neon Snake $GITHUB_REF_NAME" \
            --generate-notes
