name: Release

# Pushing a tag such as v1.1.3 builds both wallpapers from that commit and
# publishes them as a GitHub Release with checksums. The tag must match the
# version in package.json, which is the project's only version number.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Signing secrets live in a protected environment, so only tag builds (not
    # every branch push) can read them. Add required reviewers to the
    # environment to gate releases further.
    environment: release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build Windows wallpaper
        run: |
          node scripts/build-wallpapers.mjs
          mkdir -p release
          cp dist/wallpapers/Neon-Snake-Lively.zip "release/Neon-Snake-Lively-v$VERSION.zip"

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # A release APK must be signed with the project's one release key, or
      # players cannot update in place. Without the secrets the release fails
      # rather than shipping another throwaway signature.
      - name: Build signed Android wallpaper
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "The ANDROID_KEYSTORE secret is not configured; a release cannot be signed." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          gradle -p wallpaper/android :app:assembleRelease --stacktrace
          apk=wallpaper/android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          # Pin the certificate once it is known (repository variable
          # ANDROID_CERT_SHA256), so a wrong key can never ship.
          if [ -n "$ANDROID_CERT_SHA256" ]; then
            grep -qi "SHA-256 digest: $ANDROID_CERT_SHA256" "$RUNNER_TEMP/certs.txt" || {
              echo "The APK is not signed with the pinned release certificate." >&2
              exit 1
            }
          fi
          cp "$apk" "release/Neon-Snake-Android-v$VERSION.apk"

      - name: Write checksums
        working-directory: release
        run: sha256sum * | tee SHA256SUMS

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Neon Snake $GITHUB_REF_NAME" \
            --generate-notes
